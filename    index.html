<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InternHunt - Track Your Internships</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#f6f7fb] min-h-screen">
<div class="bg-white border-b sticky top-0 z-10">
<div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
<div class="flex items-center gap-2">
<span class="text-2xl">🎯</span><span class="font-bold text-xl">InternHunt</span><span class="text-xs bg-black text-white px-2 py-0.5 rounded-full">BETA</span>
</div>
<div class="flex gap-2">
<button onclick="exportData()" class="text-sm border px-3 py-1.5 rounded-lg">Export</button>
<button onclick="document.getElementById('addModal').classList.remove('hidden')" class="text-sm bg-black text-white px-4 py-1.5 rounded-lg">+ Add Internship</button>
</div>
</div>
</div>
<div class="max-w-6xl mx-auto px-4 py-6">
<div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
<div class="bg-white p-4 rounded-2xl border"><p class="text-sm text-gray-500">Applied</p><p id="sApplied" class="text-2xl font-bold">0</p></div>
<div class="bg-white p-4 rounded-2xl border"><p class="text-sm text-gray-500">Interviews</p><p id="sInterview" class="text-2xl font-bold text-blue-600">0</p></div>
<div class="bg-white p-4 rounded-2xl border"><p class="text-sm text-gray-500">Offers</p><p id="sOffer" class="text-2xl font-bold text-green-600">0</p></div>
<div class="bg-white p-4 rounded-2xl border"><p class="text-sm text-gray-500">Success Rate</p><p id="sRate" class="text-2xl font-bold">0%</p></div>
</div>
<div class="flex gap-2 mb-4 overflow-x-auto">
<button onclick="filterStatus('All')" class="fBtn bg-black text-white px-4 py-1.5 rounded-full text-sm">All</button>
<button onclick="filterStatus('Applied')" class="fBtn bg-white border px-4 py-1.5 rounded-full text-sm">Applied</button>
<button onclick="filterStatus('Interview')" class="fBtn bg-white border px-4 py-1.5 rounded-full text-sm">Interview</button>
<button onclick="filterStatus('Offer')" class="fBtn bg-white border px-4 py-1.5 rounded-full text-sm">Offer</button>
<button onclick="filterStatus('Rejected')" class="fBtn bg-white border px-4 py-1.5 rounded-full text-sm">Rejected</button>
</div>
<div id="list" class="grid md:grid-cols-2 gap-4"></div>
<div id="empty" class="text-center py-20 bg-white rounded-2xl border border-dashed">
<p class="text-4xl mb-2">📭</p><p class="font-semibold">No internships tracked yet</p><p class="text-sm text-gray-500">Add your first – Grow Your Skills Bangalore</p>
<button onclick="document.getElementById('addModal').classList.remove('hidden')" class="mt-3 bg-black text-white px-4 py-2 rounded-lg text-sm">+ Add First</button>
</div>
</div>
<div id="addModal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-20">
<div class="bg-white w-full max-w-md rounded-2xl p-6">
<h3 class="font-bold text-lg mb-4">Add Internship</h3>
<input id="company" placeholder="Company - e.g. Grow Your Skills" class="w-full border rounded-lg px-3 py-2 mb-3 text-sm">
<input id="role" placeholder="Role - e.g. Frontend Intern" class="w-full border rounded-lg px-3 py-2 mb-3 text-sm">
<select id="status" class="w-full border rounded-lg px-3 py-2 mb-3 text-sm">
<option>Applied</option><option>Interview</option><option>Offer</option><option>Rejected</option>
</select>
<input id="date" type="date" class="w-full border rounded-lg px-3 py-2 mb-3 text-sm">
<input id="link" placeholder="Job Link (optional)" class="w-full border rounded-lg px-3 py-2 mb-4 text-sm">
<div class="flex gap-2">
<button onclick="document.getElementById('addModal').classList.add('hidden')" class="flex-1 border py-2 rounded-lg text-sm">Cancel</button>
<button onclick="addIntern()" class="flex-1 bg-black text-white py-2 rounded-lg text-sm">Save</button>
</div>
</div>
</div>
<script>
let data = JSON.parse(localStorage.getItem('internhunt_v1')||'[]');
let curFilter='All';
function save(){localStorage.setItem('internhunt_v1',JSON.stringify(data)); render();}
function addIntern(){
 const c=document.getElementById('company').value.trim();
 const r=document.getElementById('role').value.trim();
 if(!c||!r) return alert('Add Company & Role');
 data.unshift({id:Date.now(),company:c,role:r,status:document.getElementById('status').value,date:document.getElementById('date').value||new Date().toISOString().split('T')[0],link:document.getElementById('link').value});
 document.getElementById('company').value='';document.getElementById('role').value='';document.getElementById('link').value='';
 document.getElementById('addModal').classList.add('hidden'); save();
}
function del(id){data=data.filter(x=>x.id!==id); save();}
function updateStatus(id,val){let i=data.find(x=>x.id===id); if(i){i.status=val; save();}}
function filterStatus(s){curFilter=s; render();}
function render(){
 const list=document.getElementById('list'); list.innerHTML='';
 let filtered = curFilter==='All'?data:data.filter(x=>x.status===curFilter);
 document.getElementById('empty').style.display = filtered.length? 'none':'block';
 document.getElementById('sApplied').innerText=data.length;
 document.getElementById('sInterview').innerText=data.filter(x=>x.status==='Interview').length;
 document.getElementById('sOffer').innerText=data.filter(x=>x.status==='Offer').length;
 document.getElementById('sRate').innerText=data.length? Math.round((data.filter(x=>x.status==='Offer').length/data.length)*100)+'%':'0%';
 filtered.forEach(x=>{
   let color = x.status==='Offer'?'bg-green-100 text-green-700': x.status==='Interview'?'bg-blue-100 text-blue-700': x.status==='Rejected'?'bg-red-100 text-red-700':'bg-gray-100 text-gray-700';
   list.innerHTML+=`<div class="bg-white border rounded-2xl p-4"><div class="flex justify-between items-start"><div><p class="font-bold">${x.company}</p><p class="text-sm text-gray-600">${x.role}</p><p class="text-xs text-gray-400 mt-1">${x.date}</p></div><span class="text-xs px-2 py-1 rounded-full ${color}">${x.status}</span></div><div class="flex gap-2 mt-3"><select onchange="updateStatus(${x.id},this.value)" class="text-xs border rounded-lg px-2 py-1"><option ${x.status==='Applied'?'selected':''}>Applied</option><option ${x.status==='Interview'?'selected':''}>Interview</option><option ${x.status==='Offer'?'selected':''}>Offer</option><option ${x.status==='Rejected'?'selected':''}>Rejected</option></select>${x.link?`<a href="${x.link}" target="_blank" class="text-xs border px-2 py-1 rounded-lg">Link</a>`:''}<button onclick="del(${x.id})" class="ml-auto text-xs text-red-500">Delete</button></div></div>`;
 });
}
function exportData(){let csv="Company,Role,Status,Date,Link\n"+data.map(x=>`"${x.company}","${x.role}","${x.status}","${x.date}","${x.link}"`).join("\n"); let blob=new Blob([csv],{type:'text/csv'}); let a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='internhunt.csv'; a.click();}
render();
</script>
</body>
</html>
