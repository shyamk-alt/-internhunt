<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CineFlicks 🎬</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:#fff;font-family:Arial,sans-serif;padding:20px}
  h1{text-align:center;font-size:40px;margin:20px 0}
  .search{text-align:center;margin:20px}
  .search input{padding:12px 20px;width:80%;max-width:400px;border-radius:25px;border:none;font-size:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px;margin-top:30px}
  .card{background:#18181b;border-radius:12px;overflow:hidden;transition:.3s}
  .card:hover{transform:scale(1.05)}
  .card img{width:100%;height:230px;object-fit:cover}
  .info{padding:10px}
  .info h3{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rate{color:#facc15;margin-top:5px}
</style>
</head>
<body>
<h1>CineFlicks 🎬</h1>
<div class="search">
  <input type="text" id="searchBox" placeholder="Search movies... (e.g. Avengers)" onkeyup="searchMovie()">
</div>
<div class="grid" id="movieGrid"></div>

<script>
const API_KEY = '3e9575f4a6c7e49e2d3f4f8a6c5e9b1d'; // replace with your TMDB key or use demo
const grid = document.getElementById('movieGrid');

// Demo movies if no API key
const demoMovies = [
  {title:"Avengers Endgame",poster_path:"/or06FN3Dka5tukK1e9sl16pB3iy.jpg",vote_average:8.3},
  {title:"Inception",poster_path:"/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg",vote_average:8.4},
  {title:"Interstellar",poster_path:"/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",vote_average:8.5},
  {title:"Spider-Man No Way Home",poster_path:"/1g0dhYtq4irTY1GPXvft6k4YLjm.jpg",vote_average:8.1},
  {title:"The Dark Knight",poster_path:"/qJ2tW6WMUDux911r6m7haRef0WH.jpg",vote_average:8.5},
  {title:"Avatar 2",poster_path:"/s16H6tpK2utvwDtzZ8Qy4qm5Emw.jpg",vote_average:7.6},
];

function showMovies(movies){
  grid.innerHTML = movies.map(m => `
    <div class="card">
      <img src="https://image.tmdb.org/t/p/w500${m.poster_path}" onerror="this.src='https://via.placeholder.com/500x750?text=No+Image'">
      <div class="info">
        <h3>${m.title}</h3>
        <div class="rate">⭐ ${m.vote_average?.toFixed(1) || 'N/A'}</div>
      </div>
    </div>
  `).join('');
}

async function fetchMovies(query='popular'){
  try{
    let url = query==='popular' 
      ? `https://api.themoviedb.org/3/movie/popular?api_key=8265bd1679663a7ea12ac168da84d2e8`
      : `https://api.themoviedb.org/3/search/movie?api_key=8265bd1679663a7ea12ac168da84d2e8&query=${query}`;
    const res = await fetch(url);
    const data = await res.json();
    showMovies(data.results || demoMovies);
  }catch(e){
    showMovies(demoMovies);
  }
}

function searchMovie(){
  const q = document.getElementById('searchBox').value;
  if(q.length>2) fetchMovies(q);
  else if(q.length===0) fetchMovies('popular');
}

fetchMovies('popular');
</script>
</body>
</html>
